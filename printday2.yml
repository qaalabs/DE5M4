# Site name
site_name: Module 4 - Planning Data Engineering Product
use_directory_urls: false
dev_addr: '0.0.0.0:8000'

# Navigation menu
nav:
  - "Day 2 ~ Technical Foundation":
    - "Lab 1: Working locally with Git": day2/source-control/git-locally.md
    - "Lab 2: Create a Repo in GitHub": day2/source-control/github-repo.md
    - "Lab 3: Create an Issue": day2/source-control/github-create-issue.md
    - "Lab 4: Fork a Repository": day2/source-control/github-forking.md
    - "Lab 5: Create a Pull Request": day2/source-control/github-pull-request.md
    - "Cloud ~ Core Building Blocks": day2/cloud/building-blocks.md
    - "Cloud Architecture Scenarios": day2/cloud/architecture.md
    - "Cloud Architecture": day2/cloud/scenario.md

# Theme
theme:
    name: material

# Extensions
markdown_extensions:
  - admonition
  - attr_list
  - codehilite:
      guess_lang: false
  - def_list
  - footnotes
  - meta
  - tables
  - toc:
      permalink: false
      toc_depth: 2

  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.tilde

plugins:
  - print-site:
      enumerate_headings: false
      add_table_of_contents: false
      add_cover_page: true
      cover_page_template: printday_cover.tpl

