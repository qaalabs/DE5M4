# Site name
site_name: DE5-M4
site_description: "Planning a Data Engineering Project" 

# Navigation menu
nav:
  - Overview: index.md
  - Setup: setup.md
  - Introduction: 1-introduction/index.md
  - Digital Design:
    - "Exercise 1: Brainstorming": 1-introduction/ex1-brainstorming.md
    - "Exercise 2: Scenario": 1-introduction/ex2-scenario.md
  - "A: Agile": a-agile/index.md
  - "C: Git and GitHub":
    - "Exercise 1: Forking": c-git/ex4-forking.md
  - "D: Cloud": d-cloud/index.md
  - "E: Databases": e-databases/index.md
  - "F: Databases": f-python/index.md
  - Presentations: presentations/index.md

# Theme
theme:
    feaures:
      - tabs
    name: material
    icon:
      logo: material/cloud
    static_templates:
      - 404.html

# Extensions
markdown_extensions:
  - markdown.extensions.admonition
  - markdown.extensions.attr_list
  - markdown.extensions.codehilite:
      guess_lang: false
  - markdown.extensions.def_list
  - markdown.extensions.footnotes
  - markdown.extensions.meta
  - markdown.extensions.toc:
      permalink: true
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - pymdownx.tilde

plugins:
  - search
