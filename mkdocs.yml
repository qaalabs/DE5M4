    - "Breakout: How are products designed?": day1/agile/how-design-steps.md
    - "Breakout: Apply to your scenario": day1/agile/scenario.md
    - "Solo Activity: Identify Epics": day1/planning/epics.md
    - "Groups: Write User Stories": day1/planning/user-stories.md
    - "Play Planning Poker ⏳": day1/planning/user-stories-solution.md
    - "Groups: Plan a 2-week sprint": day1/planning/sprint-planning.md

  - "Day 2 - Technical Foundation":
    - "Activity 1: Working locally with Git": day2/source-control/git-locally.md
    - "Activity 2: Create a Repo in GitHub": day2/source-control/github-repo.md
    - "Activity 3: Create an Issue": day2/source-control/github-create-issue.md
    - "Activity 4: Fork a Repository": day2/source-control/github-forking.md
    - "Activity 5: Create a Pull Request": day2/source-control/github-pull-request.md
