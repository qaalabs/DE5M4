# Site name
site_name: DE5-M4 ~ Planning a Data Engineering Project 

# Navigation menu
nav:
  - Overview: index.md

  - "A: Agile":
    - "Agile and DevOps": a-agile/index.md
    - "Activity 1: Design Steps": a-agile/1a-design-steps.md
    - "Activity 2: Application" : a-agile/2a-application.md
    - "Activity 3: Work Project": a-agile/3a-work-project.md

  - "B: Product Planning":
    - "Restaurant Scenario": b-plan/index.md
    - "Activity 1: Identify Epics" : b-plan/1a-identify-epics.md
    - "Activity 2: User Stories"   : b-plan/2a-user-stories.md
    - "Activity 3: Estimate Effort": b-plan/3a-estimate-effort.md
    - "Activity 4: Sprint Planning": b-plan/4a-sprint-planning.md

  - "C: Source Control":
    - Overview: c-svc/index.md

  - "D: Cloud": d-cloud/index.md

  - "E: Storage": e-storage/index.md

  - "F: Python for Data": f-python/index.md

  - Presentations: presentations/index.md
  
  - File Downloads: downloads.md

# Existing files but not in nav
not_in_nav: |
  ksb.md
  quiz/*
  images/README.md
  e-storage/*
  f-python/*

# Theme
theme:
    feaures:
      - tabs
    name: material
    icon:
      logo: material/database
    static_templates:
      - 404.html

# Extensions
markdown_extensions:
  - markdown.extensions.admonition
  - markdown.extensions.attr_list
  - markdown.extensions.codehilite:
      guess_lang: false
  - markdown.extensions.def_list
  - markdown.extensions.footnotes
  - markdown.extensions.meta
  - markdown.extensions.toc:
      permalink: true
  - pymdownx.arithmatex
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.critic
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      repo_url_shorthand: true
      user: squidfunk
      repo: mkdocs-material
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - pymdownx.tilde

plugins:
  - search
